spring:
  application:
    name: lms-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/lms-project
    username: postgres
    password: ${DB_PASSWORD:***REMOVED***}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
